name: CI

# PR과 master 푸시마다 검사한다. 배포는 Vercel이 master를 받아 자동으로 한다.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: 타입·린트·포맷·단위 테스트·콘텐츠 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # package.json의 packageManager 버전을 쓴다

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Java 모범 답안·Java 하네스 테스트용 (JAVA_HOME을 잡아 준다)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 포맷
        run: pnpm format:check

      - name: 단위 테스트 (PGlite로 마이그레이션·RLS 포함)
        run: pnpm test

      - name: 콘텐츠 검증 (105문제 Python·JS·Java 모범 답안)
        run: pnpm validate:content

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium 설치
        run: pnpm exec playwright install --with-deps chromium

      # 프로덕션 빌드를 3100번 포트에 띄워 게스트 흐름을 확인한다 (키 없이 동작)
      - name: E2E
        run: pnpm test:e2e

      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  migrations:
    name: 마이그레이션 알림
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 새 마이그레이션은 운영 Supabase에 직접 적용해야 한다 (Vercel 배포만으로는 적용되지 않는다)
      - name: 바뀐 마이그레이션 확인
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations/)
          if [ -z "$changed" ]; then
            echo "바뀐 마이그레이션이 없어요." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 운영 Supabase에 적용할 마이그레이션"
            echo "병합하기 전후로 Supabase SQL Editor(또는 \`supabase db push\`)에서 순서대로 적용하세요."
            echo
            echo "$changed" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r file; do
            echo "::warning file=$file::운영 Supabase에 이 마이그레이션을 적용해야 해요"
          done <<< "$changed"
